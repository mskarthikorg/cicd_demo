name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  # ---------------------------------------------------------
  # PR CHECKS
  # Runs only when a Pull Request targets main.
  # ---------------------------------------------------------
  analyze_and_test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lcov

          COVERAGE=$(lcov --summary coverage/lcov.info 2>/dev/null \
            | grep "lines" \
            | grep -oP '\d+\.\d+(?=%)')

          echo "Line coverage: ${COVERAGE}%"

          THRESHOLD=70

          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info


  # ---------------------------------------------------------
  # CODEMAGIC TRIGGER
  # Runs only after code reaches main.
  # Normally this happens after the admin merges a PR.
  # ---------------------------------------------------------
  trigger_codemagic:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
      CODEMAGIC_APP_ID: ${{ secrets.CODEMAGIC_APP_ID }}

    steps:
      - name: Trigger Codemagic Firebase distribution build
        run: |
          echo "Triggering Codemagic Android Firebase build..."

          RESPONSE=$(curl -sS --fail-with-body \
            -H "Content-Type: application/json" \
            -H "x-auth-token: ${CODEMAGIC_API_TOKEN}" \
            -X POST \
            --data "{
              \"appId\": \"${CODEMAGIC_APP_ID}\",
              \"workflowId\": \"android-firebase\",
              \"branch\": \"main\"
            }" \
            https://api.codemagic.io/builds)

          echo "Codemagic build successfully triggered."
          echo "$RESPONSE"